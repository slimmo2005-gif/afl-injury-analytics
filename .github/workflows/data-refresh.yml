name: Weekly data refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline
        run: pip install -e data-pipeline

      - name: Run ETL (2012–current)
        run: python -m data_pipeline run --from-season 2012 --to-season 2024

      - name: Export parquet snapshot
        run: |
          python -c "
          import duckdb
          from pathlib import Path
          con = duckdb.connect('data-pipeline/processed/afl_analytics.duckdb', read_only=True)
          out = Path('shared/output')
          out.mkdir(parents=True, exist_ok=True)
          con.execute(\"COPY availability TO 'shared/output/availability.parquet' (FORMAT PARQUET)\")
          "

      - name: Commit data artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared/output/ frontend/public/data/
          git diff --staged --quiet || git commit -m "chore: weekly data refresh"
          git push
