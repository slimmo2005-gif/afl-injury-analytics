name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'index.html'
      - '404.html'
      - 'assets/**'
      - 'data/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pipeline (if metrics missing)
        run: |
          if [ ! -f frontend/public/data/metrics.json ]; then
            pip install -e data-pipeline
            python -m data_pipeline run --from-season 2012 --to-season 2024 --vfl-from-season 2021
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ANALYTICS_API_URL: ${{ secrets.AFL_ANALYTICS_API_URL }}
        run: npm run build

      - name: SPA fallback for client-side routes
        working-directory: frontend/dist
        run: cp index.html 404.html

      - name: Publish built site to repo root (Pages serves main branch)
        run: |
          cp frontend/dist/index.html ./index.html
          cp frontend/dist/404.html ./404.html
          rm -rf ./assets ./data ./brand
          cp -r frontend/dist/assets ./assets
          cp -r frontend/dist/data ./data
          cp -r frontend/dist/brand ./brand
          touch .nojekyll

      - name: Deploy to gh-pages branch (optional mirror)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true

      - name: Commit root site files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets data brand .nojekyll
          git diff --staged --quiet || git commit -m "chore: publish site to repo root [skip ci]"
          git push
