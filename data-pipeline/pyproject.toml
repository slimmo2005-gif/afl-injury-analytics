[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afl-data-pipeline"
version = "0.2.0"
description = "AFL availability ETL for injury-adjusted analytics"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "duckdb>=1.2.0",
  "requests>=2.32.0",
  "pyarrow>=19.0.0",
  "pyreadr>=0.5.0",
  "numpy>=2.0.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
]

[project.scripts]
afl-pipeline = "data_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
